<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="70%" stop-color="#05070f" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="orbGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Space Backdrop -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.6" />

  <!-- Background Stars & Grid -->
  <g opacity="0.3">
    <circle cx="90" cy="110" r="1.5" fill="#ffffff" />
    <circle cx="420" cy="90" r="1.5" fill="#38bdf8" />
    <circle cx="120" cy="390" r="1.5" fill="#c084fc" />
    <circle cx="390" cy="410" r="2" fill="#ffffff" />
    <circle cx="230" cy="70" r="1" fill="#38bdf8" />
    <circle cx="450" cy="240" r="1" fill="#ffffff" />
  </g>

  <!-- Outer Orbital Navigation Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanPurple)" stroke-width="2.5" stroke-dasharray="14 10" opacity="0.4" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25" />

  <!-- NOVA Waveform / Gyro Rings -->
  <ellipse cx="256" cy="256" rx="130" ry="60" fill="none" stroke="url(#cyanPurple)" stroke-width="3" transform="rotate(-28 256 256)" filter="url(#glow)" />
  <ellipse cx="256" cy="256" rx="130" ry="60" fill="none" stroke="url(#cyanPurple)" stroke-width="3" transform="rotate(32 256 256)" opacity="0.8" />

  <!-- Orbiting Waypoint Nodes -->
  <circle cx="140" cy="195" r="5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="372" cy="318" r="6" fill="#c084fc" filter="url(#glow)" />

  <!-- Central NOVA Core -->
  <circle cx="256" cy="256" r="68" fill="url(#orbGlow)" filter="url(#glow)" opacity="0.95" />
  <circle cx="256" cy="256" r="50" fill="#0f172a" />
  <circle cx="256" cy="256" r="38" fill="url(#cyanPurple)" />
  <circle cx="242" cy="242" r="12" fill="#ffffff" opacity="0.6" />

  <!-- Spaceship Silhouette Emblem in Core -->
  <path d="M 256 226 L 272 266 L 256 258 L 240 266 Z" fill="#ffffff" opacity="0.9" />
</svg>
